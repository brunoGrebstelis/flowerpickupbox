<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Flower Pickup Box Control</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="top-card">
      <div>
        <p class="eyebrow">APP</p>
        <h1>Flower Pickup Box Control Panel</h1>
      </div>
      <div class="api-config">
        <label for="apiBaseUrl">API URL</label>
        <input id="apiBaseUrl" type="text" inputmode="url" autocomplete="off" value="" placeholder="https://<api-id>.execute-api.eu-central-1.amazonaws.com" />
      </div>
    </header>

    <section class="card selector-card">
      <div class="field">
        <label for="userSelect">User</label>
        <select id="userSelect">
          <option value="">Choose user</option>
        </select>
      </div>
      <div class="field">
        <label for="machineSelect">Machine</label>
        <select id="machineSelect" disabled>
          <option value="">Choose machine</option>
        </select>
      </div>
      <div class="actions">
        <button id="loadBtn" class="btn btn-primary">Load Dashboard</button>
        <button id="clearBtn" class="btn">Clear</button>
      </div>
    </section>

    <p id="statusBar" class="status"></p>

    <section class="grid grid-3">
      <article class="card">
        <h2>User Information</h2>
        <div id="userInfo" class="info-list">
          <p class="placeholder">Select a user and machine.</p>
        </div>
      </article>
      <article class="card">
        <h2>Machine Information</h2>
        <div id="machineInfo" class="info-list">
          <p class="placeholder">-</p>
        </div>
      </article>
      <article class="card">
        <h2>Machine Status</h2>
        <div id="machineStatus" class="info-list">
          <p class="placeholder">-</p>
        </div>
      </article>
    </section>

    <section class="card">
      <h2>Lockers</h2>
      <p class="legend">
        <span class="dot dot-green"></span> available
        <span class="dot dot-red"></span> sold
        <span class="dot dot-orange"></span> left open
      </p>
      <div id="lockerGrid" class="locker-grid"></div>
    </section>

    <section class="grid grid-2">
      <article class="card">
        <h2>Locker Commands</h2>
        <p id="selectedLockerText" class="subtle">No locker selected</p>
        <div class="form-row">
          <label for="lockerPrice">Price</label>
          <input id="lockerPrice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 12.50" />
          <button id="setPriceBtn" class="btn">Set price</button>
        </div>
        <div class="form-row">
          <label>Color RGB</label>
          <div class="rgb-row">
            <input id="colorR" type="number" inputmode="numeric" min="0" max="255" placeholder="R" />
            <input id="colorG" type="number" inputmode="numeric" min="0" max="255" placeholder="G" />
            <input id="colorB" type="number" inputmode="numeric" min="0" max="255" placeholder="B" />
          </div>
          <button id="setColorBtn" class="btn">Set color</button>
        </div>
        <div class="mode-block">
          <label>Lighting effects for selected locker</label>
          <div id="lightingModeButtons" class="lighting-mode-list"></div>
        </div>
        <div class="command-row">
          <button id="openLockerBtn" class="btn btn-primary">Open locker</button>
        </div>
      </article>

      <article class="card">
        <h2>Machine Commands</h2>
        <div class="form-row">
          <label for="setTemp">Set temperature (°C)</label>
          <input id="setTemp" type="number" inputmode="decimal" step="0.1" placeholder="e.g. 7.5" />
          <button id="setTempBtn" class="btn">Set temperature</button>
        </div>
        <div class="mode-block">
          <label>Set fans</label>
          <div id="fanButtons" class="fan-button-row"></div>
        </div>
        <div class="mode-block">
          <label>Set operation mode</label>
          <button id="toggleOpModeBtn" class="btn state-toggle off" type="button">Operation mode: OFF</button>
        </div>
        <div class="command-row">
          <button id="rebootRpiBtn" class="btn">Reboot RPI</button>
          <button id="rebootStmBtn" class="btn">Reboot STM32</button>
        </div>
      </article>
    </section>

    <section class="grid grid-2">
      <article class="card">
        <h2>Admin Statistics</h2>
        <div id="adminStats" class="info-list">
          <p class="placeholder">Only shown for admin users.</p>
        </div>
      </article>
      <article class="card">
        <h2>Recent Activity</h2>
        <div id="activityLogs" class="activity-list">
          <p class="placeholder">-</p>
        </div>
      </article>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
